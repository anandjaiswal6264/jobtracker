
{% extends "base.html" %}

{% block content %}

<h1>Add Job Application</h1>

<form method="POST">

    <label>Company Name</label>

    <input
        type="text"
        name="company"
        required
    >


    <label>Position</label>

    <input
        type="text"
        name="position"
        required
    >


    <label>Location</label>

    <input
        type="text"
        name="location"
        required
    >


    <label>Status</label>

    <select name="status">

        <option value="Applied">
            Applied
        </option>

        <option value="Interview">
            Interview
        </option>

        <option value="Selected">
            Selected
        </option>

        <option value="Rejected">
            Rejected
        </option>

    </select>


    <label>Applied Date</label>

    <input
        type="date"
        name="applied_date"
        required
    >


    <button type="submit">
        Add Job
    </button>

</form>

{% endblock %}
